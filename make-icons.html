<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توليد أيقونة التطبيق</title>
<style>
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6fb;color:#1B2E5A;
    display:flex;flex-direction:column;align-items:center;padding:30px 18px;text-align:center;line-height:1.8}
  h1{font-size:1.3rem;margin-bottom:6px}
  p{color:#5a6a8a;max-width:440px;margin:0 auto 18px;font-size:.95rem}
  #preview{width:220px;height:220px;border-radius:48px;box-shadow:0 12px 40px rgba(27,46,90,.25);margin:10px 0 22px}
  button{background:linear-gradient(135deg,#1B2E5A,#2f4f96);color:#fff;border:none;padding:15px 26px;
    border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 8px 22px rgba(27,46,90,.3);
    font-family:inherit;margin:5px}
  button:active{transform:translateY(1px)}
  .ok{color:#2e9e6b;font-weight:700;margin-top:14px;min-height:24px}
  canvas{display:none}
</style>
</head>
<body>
  <h1>🎨 توليد أيقونة التطبيق</h1>
  <p>هذه الصفحة تنشئ أيقونة التطبيق (خلفية زرقاء + الشعار + «برنامج المدير») بحروف عربية صحيحة. اضغط الزر لتنزيل الأيقونتين، ثم ضعهما بجانب ملفات البرنامج.</p>
  <img id="preview" alt="معاينة">
  <div>
    <button onclick="downloadIcons()">⬇️ تنزيل الأيقونتين (192 و 512)</button>
  </div>
  <div class="ok" id="msg"></div>
  <canvas id="cv"></canvas>

<script>
const LOGO_SRC = "logo.png"; // موجود بجانب هذا الملف
const logo = new Image();
logo.crossOrigin = "anonymous";

function drawIcon(size){
  const cv = document.getElementById('cv');
  cv.width = size; cv.height = size;
  const ctx = cv.getContext('2d');
  const s = size/512;

  // خلفية متدرجة زرقاء بحواف دائرية
  const r = 112*s;
  const grad = ctx.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,'#24407a');
  grad.addColorStop(1,'#132247');
  roundRect(ctx,0,0,size,size,r); ctx.fillStyle=grad; ctx.fill();

  // دائرة زخرفية خفيفة
  ctx.beginPath(); ctx.arc(110*s,90*s,140*s,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fill();

  // بطاقة بيضاء للشعار
  roundRect(ctx,146*s,78*s,220*s,220*s,48*s); ctx.fillStyle='#fff'; ctx.fill();

  // الشعار
  if(logo.complete && logo.naturalWidth){
    ctx.drawImage(logo,160*s,84*s,192*s,190*s);
  }

  // النص العربي (المتصفح يشكّله بشكل صحيح)
  ctx.textAlign='center'; ctx.direction='rtl';
  ctx.fillStyle='#ffffff';
  ctx.font='bold '+(62*s)+'px Tahoma, Arial, sans-serif';
  ctx.fillText('برنامج المدير',256*s,392*s);
  ctx.fillStyle='#c8d0e0';
  ctx.font=(31*s)+'px Tahoma, Arial, sans-serif';
  ctx.fillText('المدرسة القرآنية الوقفية',256*s,436*s);

  return cv;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function download(cv,name){
  cv.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  },'image/png');
}
function downloadIcons(){
  download(drawIcon(512),'icon-512.png');
  setTimeout(()=>download(drawIcon(192),'icon-192.png'),400);
  document.getElementById('msg').textContent='✅ تم تنزيل الأيقونتين. ضعهما بجانب ملفات البرنامج.';
}
logo.onload = ()=>{ document.getElementById('preview').src = drawIcon(512).toDataURL(); };
logo.onerror = ()=>{ document.getElementById('preview').src = drawIcon(512).toDataURL(); document.getElementById('msg').textContent='(تعذّر تحميل الشعار، تأكد أن logo.png بجانب هذا الملف)'; };
logo.src = LOGO_SRC;
</script>
</body>
</html>
